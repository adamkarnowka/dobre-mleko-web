# Applied by .github/workflows/deploy.yml. Lives next to the API (dobre-mleko-be) in the
# `dobre-mleko` namespace: nginx proxies /api and /files to its `api` service.
apiVersion: v1
kind: Namespace
metadata:
  name: dobre-mleko
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: dobre-mleko
spec:
  replicas: 1
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: web
          image: IMAGE_PLACEHOLDER
          env:
            - { name: API_UPSTREAM, value: http://api.dobre-mleko.svc.cluster.local }
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: dobre-mleko
spec:
  selector: { app: web }
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: dobre-mleko
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts: [HOST_PLACEHOLDER]
      secretName: web-tls
  rules:
    - host: HOST_PLACEHOLDER
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
